<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Maqueta · Escalera de frases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --texto: #ecebe6;
      --tenue: #6b6b6b;
      --linea: #2a2a2a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: var(--texto);
      font-family: 'Lexend', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

    /* ---------- Escena (arriba) ---------- */
    #escena { position: relative; flex: 1 1 56%; min-height: 0; }
    #escena svg { display: block; width: 100%; height: 100%; }
    .rotulo {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top));
      left: 20px;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #444;
    }
    #paso-n { color: #888; }
    #aviso {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #aaa;
    }

    .suelo { stroke: #1d1d1d; stroke-width: 2; }
    .pilar { fill: url(#achurado-pilar); stroke: #333; stroke-width: 1.5; }
    .bloque-svg { stroke: #9a9a9a; stroke-width: 1.5; }
    .fila { transition: opacity .6s; }
    .fantasma rect { fill: none; stroke: #3a3a3a; stroke-width: 1.5; stroke-dasharray: 6 7; }
    .frente { stroke: #fff; stroke-linecap: round; }
    #pj polyline, #pj circle, #pj path, #pj rect { fill: none; stroke: #f2f2f2; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    #pj circle, #pj rect { fill: #000; }
    #pj #visor { stroke-width: 2; stroke: #bdbdbd; }

    #final {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      padding-top: calc(18px + env(safe-area-inset-top));
      pointer-events: none;
      animation: aparecer .6s ease;
    }
    #final[hidden] { display: none; }
    #final div { pointer-events: auto; }
    #final p { margin: 0; font-size: clamp(26px, 4vw, 38px); font-weight: 600; }
    #final div { display: flex; gap: 12px; }

    /* ---------- Texto (abajo) ---------- */
    #texto {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 28%;
      padding: 8px 32px 20px;
      overflow: hidden;
    }
    .linea { max-width: 980px; font-size: clamp(26px, 4vw, 44px); line-height: 1.75; text-align: center; }
    /* Escala de grises: lo que falta leer se ve nítido; lo leído se apaga un poco */
    .w { color: #d9d9d9; transition: color .25s, box-shadow .25s; padding: 0 .04em; }
    .w.leida { color: #6e6e6e; }
    .w.actual { color: #fff; box-shadow: inset 0 -3px 0 #fff; }
    .bloque { display: inline; }
    .bloque.nuevo { animation: aparecer .7s ease; }
    .corte { margin: 0 .3em; font-weight: 300; color: #333; }
    @keyframes aparecer { from { opacity: 0; filter: blur(4px); } }

    /* Modo teleprompter: una sola línea que se desliza */
    #texto.tele { justify-content: flex-start; height: 28%; }
    #texto.tele .linea {
      position: absolute;
      top: 50%;
      left: 0;
      max-width: none;
      white-space: nowrap;
      text-align: left;
      transform: translate(var(--dx, 0px), -50%);
      transition: transform .55s ease;
    }
    #texto.tele::before, #texto.tele::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      z-index: 1;
      width: 14%;
      pointer-events: none;
    }
    #texto.tele::before { left: 0; background: linear-gradient(90deg, #000, transparent); }
    #texto.tele::after { right: 0; background: linear-gradient(270deg, #000, transparent); }

    /* ---------- Controles de la maqueta ---------- */
    #controles {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px 14px;
      padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
      border-top: 1px solid #151515;
      font-size: 14px;
      color: #888;
    }
    select, button {
      padding: 8px 14px;
      border: 1px solid var(--linea);
      border-radius: 999px;
      background: #0d0d0d;
      color: #ccc;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    select { max-width: 260px; }
    button.primario { background: var(--texto); border-color: var(--texto); color: #000; font-weight: 600; }
    #final button { padding: 14px 28px; font-size: 18px; }
    .seg { display: inline-flex; border: 1px solid var(--linea); border-radius: 999px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; background: transparent; }
    .seg button.on { background: var(--texto); color: #000; }
    label { display: inline-flex; align-items: center; gap: 8px; }
    input[type=range] { width: 120px; accent-color: #bdbdbd; }
    input[type=checkbox] { accent-color: #bdbdbd; }
    [hidden] { display: none !important; }

    @media (max-width: 600px) {
      #texto { padding: 8px 16px 16px; }
      #controles { gap: 8px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <section id="escena">
    <div class="rotulo">Maqueta · <span id="paso-n"></span></div>
    <div id="aviso" hidden></div>
    <svg id="svg" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    <div id="final" hidden>
      <p>¡Oración completa!</p>
      <div>
        <button id="repetir">Repetir</button>
        <button id="siguiente" class="primario">Siguiente oración</button>
      </div>
    </div>
  </section>

  <section id="texto"><div class="linea" id="linea"></div></section>

  <nav id="controles">
    <select id="sel-oracion" aria-label="Oración"></select>
    <div class="seg" id="seg-modo">
      <button data-modo="auto" class="on">Auto</button>
      <button data-modo="manual">Manual</button>
      <button data-modo="mic">Micrófono</button>
    </div>
    <label class="solo-auto">Velocidad <input type="range" id="vel" min="50" max="150" step="5" value="90"> <span id="vel-n">90</span> pal/min</label>
    <label class="solo-auto"><input type="checkbox" id="retraso" checked> Simular retraso del micrófono</label>
    <button id="btn-palabra" class="primario solo-manual" hidden>▶ Palabra</button>
    <button id="btn-mic" class="primario solo-mic" hidden>🎤 Empezar</button>
    <div class="seg" id="seg-texto">
      <button data-texto="fijo" class="on">Texto fijo</button>
      <button data-texto="tele">Teleprompter</button>
    </div>
    <button id="reiniciar">↺ Reiniciar</button>
  </nav>

  <script src="../js/analisis.js"></script>
  <script>
  'use strict';

  const { silabas, normalizar, alinear } = window.Analisis;

  // " / " separa los bloques con sentido de cada oración.
  // Texto: «El astronauta curioso»
  const ORACIONES = [
    'Lucas sueña con ser astronauta.',
    'Todas las noches mira las estrellas / con su telescopio / desde la ventana de su habitación.',
    'Ya conoce el nombre / de varios planetas: / Mercurio, Venus, Marte y Júpiter.',
    'Su favorito es Saturno, / porque tiene unos anillos espectaculares.',
    'Algún día, / Lucas quiere viajar por el espacio / y descubrir un planeta nuevo / para ponerle el nombre de su perro.',
  ];
  const ORACION_INICIAL = 1;
  // Cada bloque se distingue por su achurado (ángulo y separación), no por color.
  const ACHURADOS = [
    { angulo: 45, sep: 7 },
    { angulo: -45, sep: 7 },
    { angulo: 90, sep: 6 },
    { angulo: 0, sep: 8 },
    { angulo: 25, sep: 9 },
    { angulo: -65, sep: 9 },
  ];

  // Geometría de la escena (unidades del viewBox 1000 × 520)
  const PILAR = 40;      // borde izquierdo del pilar de partida
  const IZQ = 104;       // inicio de la escalera
  const DER = 965;       // fin de la escalera
  const HUECO = 6;       // separación entre bloques
  const ARRIBA = 150;    // altura del primer nivel
  const ABAJO = 490;     // límite inferior

  const $ = (id) => document.getElementById(id);
  const $svg = $('svg');
  const $linea = $('linea');
  const $texto = $('texto');
  const $final = $('final');
  const NS = 'http://www.w3.org/2000/svg';
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ================= Estado =================
  let o = null;          // oración preparada
  let paso = 1;          // nivel actual (1..n): paso k muestra los bloques 1..k
  let pos = 0;           // palabras leídas en el paso actual
  let fase = 'leyendo';  // leyendo | pausa | fin
  let revelado = IZQ;    // x hasta donde se materializó el nivel actual
  let pj = null;         // personaje
  let confeti = [];
  let modo = 'auto';
  let teleprompter = false;
  let gen = 0;           // invalida temporizadores al reiniciar
  let dicho = 0;         // modo auto: palabras "dichas" (lo reconocido puede ir atrasado)

  // ================= Preparar oración =================
  function prepararOracion(txt) {
    const palabras = [];
    const inicios = [0];
    for (const t of txt.replace(/\s*\/\s*/g, ' / ').trim().split(/\s+/)) {
      if (t === '/') { if (palabras.length) inicios.push(palabras.length); continue; }
      const limpia = t.replace(/[^\p{L}]/gu, '');
      palabras.push({ bruta: t, norm: normalizar(limpia), sil: Math.max(1, silabas(limpia).length) });
    }
    const bloques = inicios.map((a, j) => [a, j + 1 < inicios.length ? inicios[j + 1] : palabras.length]);
    const n = bloques.length;

    // El ancho de cada palabra en la escalera es proporcional a su largo.
    const acum = [0];
    for (const p of palabras) acum.push(acum[acum.length - 1] + p.bruta.length + 1);
    const total = acum[acum.length - 1];
    const util = DER - IZQ - HUECO * (n - 1);
    const bloqueDe = (i) => bloques.findIndex(([a, b]) => i > a && i <= b);

    const altoFila = Math.min(78, (ABAJO - ARRIBA) / n);
    return {
      palabras,
      bloques,
      n,
      altoFila,
      escala: Math.max(0.75, Math.min(1, altoFila / 78)),
      // x del frente de lectura después de leer i palabras
      posX: (i) => (i === 0 ? IZQ : IZQ + (util * acum[i]) / total + HUECO * bloqueDe(i)),
      izqBloque: (j) => IZQ + (util * acum[bloques[j][0]]) / total + HUECO * j,
      derBloque: (j) => IZQ + (util * acum[bloques[j][1]]) / total + HUECO * j,
      topeFila: (r) => ARRIBA + (r - 1) * altoFila,
      finPaso: (k) => bloques[k - 1][1],
    };
  }
  const finFila = (r) => o.derBloque(r - 1);

  // ================= Construir la escena SVG =================
  function construirEscena() {
    const baseY = o.topeFila(o.n + 1);
    let defs = ACHURADOS.map(({ angulo, sep }, j) => `
      <pattern id="ach${j}" patternUnits="userSpaceOnUse" width="${sep}" height="${sep}" patternTransform="rotate(${angulo})">
        <line x1="0" y1="0" x2="0" y2="${sep}" stroke="#7d7d7d" stroke-width="1"/>
      </pattern>`).join('');
    defs += `
      <pattern id="achurado-pilar" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="5" stroke="#262626" stroke-width="1"/>
      </pattern>`;
    let filas = '';
    for (let r = 1; r <= o.n; r++) {
      defs += `<clipPath id="clip${r}"><rect id="clipr${r}" x="0" y="0" width="0" height="520"/></clipPath>`;
      let reales = '';
      let fantasmas = '';
      for (let j = 0; j < r; j++) {
        const x = o.izqBloque(j);
        const w = o.derBloque(j) - x;
        const y = o.topeFila(r) + 2;
        const h = o.altoFila - 4;
        reales += `<rect class="bloque-svg" x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="url(#ach${j % ACHURADOS.length})"/>`;
        fantasmas += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5"/>`;
      }
      filas += `<g class="fantasma" id="fantasma${r}" opacity="0">${fantasmas}</g>`;
      filas += `<g class="fila" id="fila${r}" clip-path="url(#clip${r})">${reales}</g>`;
      filas += `<line class="frente" id="frenteG${r}" stroke-width="10" stroke-opacity="0" y1="${o.topeFila(r) + 3}" y2="${o.topeFila(r) + o.altoFila - 3}"/>`;
      filas += `<line class="frente" id="frente${r}" stroke-width="3" stroke-opacity="0" y1="${o.topeFila(r) + 3}" y2="${o.topeFila(r) + o.altoFila - 3}"/>`;
    }
    $svg.innerHTML = `
      <defs>${defs}</defs>
      <line class="suelo" x1="20" x2="980" y1="${baseY + 1}" y2="${baseY + 1}"/>
      <rect class="pilar" x="${PILAR}" y="${o.topeFila(1) + 2}" width="${IZQ - HUECO - PILAR}" height="${baseY - o.topeFila(1) - 2}" rx="5"/>
      ${filas}
      <g id="confeti"></g>
      <g id="pj">
        <polyline id="piernaB"/><polyline id="brazoB"/>
        <rect id="mochila" width="7" height="14" rx="2"/>
        <polyline id="torso"/><circle id="cabeza" r="10"/><path id="visor"/>
        <polyline id="piernaA"/><polyline id="brazoA"/>
      </g>`;
  }

  // ================= Personaje =================
  const pts = (arr) => arr.map((p) => p.join(',')).join(' ');

  // Astronauta de líneas: casco con visor, mochila y botas.
  // Poses en coordenadas locales: origen = punto de apoyo, y negativa hacia arriba, mirando a la derecha.
  function pose(m, a, t) {
    if (m === 'sentado') {
      const k1 = Math.sin(t * 2.2) * 3;
      const k2 = Math.sin(t * 2.2 + 1.7) * 3;
      return {
        cabeza: [-1, -36], torso: [[0, -2], [-1, -25]],
        brazoA: [[-1, -21], [-6, -11], [-9, -2]], brazoB: [[-1, -21], [-4, -11], [-7, -2]],
        piernaA: [[0, -2], [10, -2], [11 + k1, 12]], piernaB: [[0, -2], [9, -1], [9 + k2, 12]],
      };
    }
    if (m === 'saltando') {
      return {
        cabeza: [1, -55], torso: [[0, -22], [1, -44]],
        brazoA: [[1, -40], [8, -46], [12, -53]], brazoB: [[1, -40], [-6, -46], [-10, -52]],
        piernaA: [[0, -22], [7, -14], [3, -5]], piernaB: [[0, -22], [4, -13], [-1, -6]],
      };
    }
    if (m === 'celebrando') {
      // salto lento, como en baja gravedad
      const h = Math.abs(Math.sin(t * 3.2));
      const f = (1 - h) * 5;
      return {
        dy: -h * 34,
        cabeza: [0, -55], torso: [[0, -22], [0, -44]],
        brazoA: [[0, -40], [9, -50], [13, -61]], brazoB: [[0, -40], [-9, -50], [-13, -61]],
        piernaA: [[0, -22], [4 + f, -11], [4, 0]], piernaB: [[0, -22], [-4 + f, -11], [-4, 0]],
      };
    }
    // caminando / parado
    const s = m === 'caminando' ? Math.sin(a) : 0;
    return {
      dy: m === 'caminando' ? -Math.abs(Math.cos(a)) * 2 : Math.sin(t * 2) * 0.6,
      cabeza: [1, -55], torso: [[0, -22], [1, -44]],
      brazoA: [[1, -40], [-4 * s + 1, -31], [-7 * s + 2, -24]], brazoB: [[1, -40], [4 * s + 1, -31], [7 * s + 2, -24]],
      piernaA: [[0, -22], [5 * s + 2, -11], [9 * s, 0]], piernaB: [[0, -22], [-5 * s + 2, -11], [-9 * s, 0]],
    };
  }

  function caminarHacia(meta, dt) {
    const d = meta - pj.x;
    if (d > 0.8) {
      const v = Math.min(260, Math.max(45, d * 3.2));
      const avance = Math.min(d, v * dt);
      pj.x += avance;
      pj.anim += avance * 0.13;
      pj.modo = 'caminando';
    } else if (pj.modo === 'caminando' || pj.modo === 'saltando') {
      pj.modo = 'parado';
    }
  }

  function actualizarPj(dt) {
    if (pj.salto) {
      const s = pj.salto;
      s.t = Math.min(1, s.t + dt / 0.55);
      pj.x = s.x0 + (s.x1 - s.x0) * s.t;
      pj.y = s.y0 + (s.y1 - s.y0) * s.t - 46 * Math.sin(Math.PI * s.t);
      pj.modo = 'saltando';
      if (s.t >= 1) { pj.salto = null; pj.fila = s.fila; pj.modo = 'parado'; }
      return;
    }
    pj.y = o.topeFila(pj.fila);

    // Esperando sentado en el nivel de arriba mientras se materializa el de abajo
    if (pj.fila < paso) {
      const borde = finFila(pj.fila) - 3;
      const hayPiso = revelado > finFila(paso - 1) + 24;
      if (pj.fila === paso - 1 && hayPiso) {
        pj.salto = { x0: pj.x, y0: pj.y, x1: finFila(paso - 1) + 14, y1: o.topeFila(paso), t: 0, fila: paso };
        return;
      }
      caminarHacia(borde, dt);
      if (pj.x >= borde - 0.5) pj.modo = 'sentado';
      return;
    }

    // En el nivel actual: camina detrás del frente de lectura
    const completo = pos >= o.finPaso(paso);
    const meta = completo ? finFila(paso) - (paso < o.n ? 3 : 34) : revelado - 14;
    caminarHacia(meta, dt);
    if (completo && pj.modo !== 'caminando') {
      if (paso < o.n) pj.modo = 'sentado';
      else if (fase === 'fin') {
        if (pj.modo !== 'celebrando') lanzarEstrellas();
        pj.modo = 'celebrando';
      }
    }
  }

  // Celebración: estrellitas grises que flotan lento.
  function lanzarEstrellas() {
    const grises = ['#ffffff', '#c8c8c8', '#8a8a8a'];
    for (let i = 0; i < 34; i++) {
      const ang = Math.random() * Math.PI * 2;
      const vel = 40 + Math.random() * 120;
      confeti.push({
        x: pj.x, y: pj.y - 45,
        vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel - 50,
        tam: 2.5 + Math.random() * 3.5, fase: Math.random() * 6.3,
        c: grises[i % grises.length], vida: 2.5 + Math.random() * 2,
      });
    }
  }

  // ================= Bucle de animación =================
  let ultimo = performance.now();

  function cuadro(ahora) {
    const dt = Math.min(0.05, (ahora - ultimo) / 1000);
    ultimo = ahora;
    const t = ahora / 1000;

    // El nivel actual se materializa con suavidad hasta donde va la lectura
    const objetivo = o.posX(pos);
    if (objetivo < revelado) revelado = objetivo;
    else revelado += (objetivo - revelado) * Math.min(1, dt * 5);
    const creciendo = Math.min(1, (objetivo - revelado) / 12);

    actualizarPj(dt);

    for (let r = 1; r <= o.n; r++) {
      const ancho = r < paso || fase === 'fin' ? 1000 : r === paso ? revelado : 0;
      $('clipr' + r).setAttribute('width', ancho);
      $('fila' + r).setAttribute('opacity', r === paso || fase === 'fin' ? 1 : 0.5); // el nivel actual destaca
      $('fantasma' + r).setAttribute('opacity', r === paso && fase === 'leyendo' ? 0.3 : 0);
      for (const id of ['frente', 'frenteG']) {
        const el = $(id + r);
        const visible = r === paso && fase !== 'fin' && revelado > IZQ + 2;
        el.setAttribute('x1', revelado);
        el.setAttribute('x2', revelado);
        el.setAttribute('stroke-opacity', visible ? (id === 'frente' ? 0.35 + 0.6 * creciendo : 0.12 * creciendo) : 0);
      }
    }

    const P = pose(pj.modo, pj.anim, t);
    $('pj').setAttribute('transform', `translate(${pj.x.toFixed(1)} ${(pj.y + (P.dy || 0) * o.escala).toFixed(1)}) scale(${o.escala})`);
    const [cx, cy] = P.cabeza;
    $('cabeza').setAttribute('cx', cx);
    $('cabeza').setAttribute('cy', cy);
    $('visor').setAttribute('d', `M${cx + 2},${cy - 6} A6,6 0 0 1 ${cx + 2},${cy + 6}`);
    const [nx, ny] = P.torso[1]; // cuello: la mochila va en la espalda
    $('mochila').setAttribute('x', nx - 9);
    $('mochila').setAttribute('y', ny + 1);
    for (const parte of ['torso', 'brazoA', 'brazoB']) $(parte).setAttribute('points', pts(P[parte]));
    for (const parte of ['piernaA', 'piernaB']) {
      const pie = P[parte][P[parte].length - 1];
      $(parte).setAttribute('points', pts([...P[parte], [pie[0] + 4, pie[1]]])); // bota
    }

    if (confeti.length) {
      confeti = confeti.filter((c) => (c.vida -= dt) > 0);
      let html = '';
      for (const c of confeti) {
        c.vy += 35 * dt;
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.vx *= 1 - dt * 0.6;
        c.vy *= 1 - dt * 0.6;
        const brillo = Math.min(1, c.vida) * (0.55 + 0.45 * Math.sin(t * 6 + c.fase));
        const x = c.x.toFixed(1);
        const y = c.y.toFixed(1);
        html += `<path d="M${x},${(c.y - c.tam).toFixed(1)}V${(c.y + c.tam).toFixed(1)}M${(c.x - c.tam).toFixed(1)},${y}H${(c.x + c.tam).toFixed(1)}" stroke="${c.c}" stroke-width="1.6" stroke-linecap="round" opacity="${brillo.toFixed(2)}"/>`;
      }
      $('confeti').innerHTML = html;
    }
    requestAnimationFrame(cuadro);
  }

  // ================= Texto =================
  function pintarTexto(nuevo = false) {
    $linea.innerHTML = o.bloques.slice(0, paso).map(([a, b], j) => {
      const ws = [];
      for (let i = a; i < b; i++) ws.push(`<span class="w" data-i="${i}">${esc(o.palabras[i].bruta)}</span>`);
      const clase = nuevo && paso > 1 && j === paso - 1 ? 'bloque nuevo' : 'bloque';
      return `<span class="${clase}">${ws.join(' ')}</span>`;
    }).join('<span class="corte">/</span>');
    $('paso-n').textContent = `Nivel ${paso} de ${o.n}`;
    marcarTexto();
  }

  function marcarTexto() {
    $linea.querySelectorAll('.w').forEach((el) => {
      const i = Number(el.dataset.i);
      el.classList.toggle('leida', i < pos);
      el.classList.toggle('actual', i === pos && fase === 'leyendo');
    });
    if (teleprompter) centrarTeleprompter();
  }

  // Mantiene la palabra actual a un 30 % del ancho; la línea se desliza hacia la izquierda.
  function centrarTeleprompter() {
    const ws = $linea.querySelectorAll('.w');
    const actual = $linea.querySelector('.w.actual');
    const ultima = ws[ws.length - 1];
    const ref = actual ? actual.offsetLeft : ultima.offsetLeft + ultima.offsetWidth - $texto.clientWidth * 0.4;
    $linea.style.setProperty('--dx', `${$texto.clientWidth * 0.3 - ref}px`);
  }

  // ================= Avance de la lectura =================
  function avanzar(n) {
    if (fase !== 'leyendo') return;
    const fin = o.finPaso(paso);
    n = Math.min(n, fin);
    if (n <= pos) return;
    pos = n;
    if (pos >= fin) {
      const g = gen;
      if (paso < o.n) {
        fase = 'pausa';
        setTimeout(() => g === gen && siguientePaso(), 1500);
      } else {
        fase = 'fin';
        setTimeout(() => { if (g === gen) $final.hidden = false; }, 2800);
      }
    }
    marcarTexto();
  }

  function siguientePaso() {
    paso++;
    pos = 0;
    fase = 'leyendo';
    pintarTexto(true);
    empezarPaso();
  }

  function empezarPaso() {
    dicho = 0;
    const g = gen;
    if (modo === 'auto') {
      setTimeout(() => g === gen && hablarAuto(g), 700);
      if ($('retraso').checked) setTimeout(() => g === gen && reportarAuto(g), 700);
    }
    if (modo === 'mic') {
      mic.consumidas = mic.cantidad; // ignora lo leído en el nivel anterior
      mic.desde = 0;
    }
  }

  // ---------- Modo auto: simula a la niña leyendo ----------
  function hablarAuto(g) {
    if (g !== gen || fase !== 'leyendo' || modo !== 'auto') return;
    if (dicho >= o.finPaso(paso)) return;
    const ppm = Number($('vel').value);
    const p = o.palabras[dicho];
    let ms = (p.sil * 60000) / (ppm * 2); // ~2 sílabas por palabra en promedio
    if (/[,;:]$/.test(p.bruta)) ms += 380;
    setTimeout(() => {
      if (g !== gen) return;
      dicho++;
      if (!$('retraso').checked) avanzar(dicho);
      hablarAuto(g);
    }, ms);
  }

  // Con "retraso": lo leído llega a saltos, como con el reconocimiento de voz real.
  function reportarAuto(g) {
    if (g !== gen || fase !== 'leyendo' || modo !== 'auto') return;
    avanzar(dicho);
    setTimeout(() => reportarAuto(g), 350 + Math.random() * 550);
  }

  // ---------- Modo micrófono ----------
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = { activo: false, rec: null, cantidad: 0, consumidas: 0, desde: 0 };

  function micIniciar() {
    if (!Rec) { aviso('Este navegador no reconoce la voz. Usa Safari en el iPad o Chrome.'); return; }
    if (mic.activo) return;
    mic.activo = true;
    if (!mic.rec) {
      const r = new Rec();
      r.lang = 'es-CL';
      r.continuous = true;
      r.interimResults = true;
      r.onresult = (e) => {
        let t = '';
        for (let i = 0; i < e.results.length; i++) t += ' ' + e.results[i][0].transcript;
        const dichas = t.split(/\s+/).map(normalizar).filter(Boolean);
        mic.cantidad = dichas.length;
        oirMic(dichas);
      };
      r.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          mic.activo = false;
          $('btn-mic').hidden = false;
          aviso('Sin permiso de micrófono. Revisa que el Dictado esté activado.');
        }
      };
      r.onend = () => {
        if (!mic.activo) return;
        setTimeout(() => {
          if (!mic.activo) return;
          try {
            r.start();
            mic.cantidad = 0;
            mic.consumidas = 0;
            mic.desde = pos;
          } catch (err) {
            if (err.name === 'InvalidStateError') return;
            mic.activo = false;
            $('btn-mic').hidden = false;
          }
        }, 250);
      };
      mic.rec = r;
    }
    mic.cantidad = 0;
    mic.consumidas = 0;
    mic.desde = pos;
    try { mic.rec.start(); } catch { /* ya estaba escuchando */ }
    $('btn-mic').hidden = true;
  }

  function micDetener() {
    mic.activo = false;
    try { mic.rec?.abort(); } catch { /* nada */ }
  }

  function oirMic(dichas) {
    if (mic.consumidas > dichas.length) mic.consumidas = dichas.length;
    if (fase !== 'leyendo') return;
    const esperadas = o.palabras.slice(0, o.finPaso(paso)).map((p) => p.norm);
    const r = alinear(esperadas, dichas.slice(mic.consumidas), mic.desde, esperadas.map(() => 'pendiente'));
    avanzar(r.pos);
  }

  let avisoT = null;
  function aviso(txt) {
    $('aviso').textContent = txt;
    $('aviso').hidden = false;
    clearTimeout(avisoT);
    avisoT = setTimeout(() => { $('aviso').hidden = true; }, 4000);
  }

  // ================= Reiniciar y controles =================
  function reiniciar() {
    gen++;
    o = prepararOracion(ORACIONES[$('sel-oracion').value]);
    construirEscena();
    paso = 1;
    pos = 0;
    fase = 'leyendo';
    revelado = IZQ;
    confeti = [];
    pj = { x: (PILAR + IZQ - HUECO) / 2 - 8, y: o.topeFila(1), fila: 1, modo: 'parado', anim: 0, salto: null };
    $final.hidden = true;
    pintarTexto();
    empezarPaso();
  }

  function cambiarModo(m) {
    modo = m;
    document.querySelectorAll('#seg-modo button').forEach((b) => b.classList.toggle('on', b.dataset.modo === m));
    document.querySelectorAll('.solo-auto').forEach((el) => { el.hidden = m !== 'auto'; });
    $('btn-palabra').hidden = m !== 'manual';
    $('btn-mic').hidden = m !== 'mic' || mic.activo;
    if (m !== 'mic') micDetener();
    reiniciar();
  }

  ORACIONES.forEach((txt, i) => {
    const op = document.createElement('option');
    const limpio = txt.replace(/\s*\/\s*/g, ' ');
    const n = txt.split('/').length;
    op.value = i;
    op.textContent = `${limpio.split(' ').slice(0, 4).join(' ')}… (${n} ${n === 1 ? 'nivel' : 'niveles'})`;
    $('sel-oracion').appendChild(op);
  });
  $('sel-oracion').value = ORACION_INICIAL;

  $('sel-oracion').addEventListener('change', reiniciar);
  $('seg-modo').addEventListener('click', (e) => { if (e.target.dataset.modo) cambiarModo(e.target.dataset.modo); });
  $('seg-texto').addEventListener('click', (e) => {
    if (!e.target.dataset.texto) return;
    teleprompter = e.target.dataset.texto === 'tele';
    document.querySelectorAll('#seg-texto button').forEach((b) => b.classList.toggle('on', b === e.target));
    $texto.classList.toggle('tele', teleprompter);
    $linea.style.removeProperty('--dx');
    marcarTexto();
  });
  $('vel').addEventListener('input', () => { $('vel-n').textContent = $('vel').value; });
  $('retraso').addEventListener('change', reiniciar);
  $('reiniciar').addEventListener('click', reiniciar);
  $('btn-palabra').addEventListener('click', () => avanzar(pos + 1));
  $('btn-mic').addEventListener('click', micIniciar);
  $('escena').addEventListener('click', (e) => { if (modo === 'manual' && !e.target.closest('#final')) avanzar(pos + 1); });
  document.addEventListener('keydown', (e) => {
    if (modo === 'manual' && (e.key === ' ' || e.key === 'ArrowRight')) { e.preventDefault(); avanzar(pos + 1); }
  });
  $('repetir').addEventListener('click', reiniciar);
  $('siguiente').addEventListener('click', () => {
    $('sel-oracion').value = (Number($('sel-oracion').value) + 1) % ORACIONES.length;
    reiniciar();
  });
  window.addEventListener('resize', () => { if (teleprompter) centrarTeleprompter(); });

  reiniciar();
  requestAnimationFrame(cuadro);
  </script>
</body>
</html>
