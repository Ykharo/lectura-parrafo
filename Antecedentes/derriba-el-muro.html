<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Derriba el muro, prototipo de lectura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #EEDFC6; --ink: #2A1A10; --muted: #6B5240;
    --btn-bg: #2A1A10; --btn-ink: #F3DDB3; --line: #B89A78; --accent: #A8321F;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #1C130E; --ink: #F3DDB3; --muted: #C9AE88;
      --btn-bg: #F3DDB3; --btn-ink: #1E1410; --line: #5A4232; --accent: #D9573E;
    }
  }
  :root[data-theme="dark"] {
    --page: #1C130E; --ink: #F3DDB3; --muted: #C9AE88;
    --btn-bg: #F3DDB3; --btn-ink: #1E1410; --line: #5A4232; --accent: #D9573E;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; min-height: 100%;
    background: var(--page); color: var(--ink);
    font-family: "Andika", "Trebuchet MS", Verdana, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 2rem 1rem 3rem; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0 0 .25rem; font-weight: 700; }
  header p { margin: 0 0 1.5rem; color: var(--muted); max-width: 60ch; }
  .band { width: 100%; border-radius: 6px; overflow: hidden; line-height: 0;
          box-shadow: 0 0 0 3px #1E1410; }
  .band svg { width: 100%; height: auto; display: block; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; margin-top: 1.25rem; }
  .tries { display: flex; gap: .4rem; margin-right: auto; align-items: center; }
  .tries span { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--ink); transition: background .3s, transform .3s; }
  .tries span.on { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
  .status { min-width: 12ch; color: var(--muted); }
  button {
    font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer;
    padding: .7rem 1.2rem; border-radius: 8px; border: 2px solid var(--btn-bg);
    background: var(--btn-bg); color: var(--btn-ink);
  }
  button.secondary { background: transparent; color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .note { margin-top: 1.5rem; font-size: .9rem; color: var(--muted); max-width: 70ch; }
  .crack { fill: none; stroke: #1E1410; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round;
           transition: stroke-dashoffset .28s ease-out, opacity .4s; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Derriba el muro</h1>
    <p>Cada vez que la palabra se lee bien, cinco guerreros embisten el muro. A la tercera, cae.</p>
  </header>

  <div class="band">
    <svg id="scene" viewBox="0 0 1200 296" role="img" aria-label="Palabra junto a un muro que unos guerreros griegos intentan derribar">
      <defs>
        <radialGradient id="clay" cx="50%" cy="45%" r="75%">
          <stop offset="0" stop-color="#D9773D"/>
          <stop offset="1" stop-color="#BF5A28"/>
        </radialGradient>
        <pattern id="meander" width="24" height="22" patternUnits="userSpaceOnUse">
          <rect width="24" height="22" fill="#C35E2B"/>
          <path d="M0 19 H24 M20 19 V3 H5 V14 H15 V8 H11" fill="none" stroke="#1E1410" stroke-width="2.6"/>
        </pattern>
      </defs>
      <rect width="1200" height="296" fill="url(#clay)"/>
      <rect y="0" width="1200" height="22" fill="url(#meander)"/>
      <rect y="22" width="1200" height="3" fill="#1E1410"/>
      <text id="word" x="34" y="238" font-family="Andika, 'Trebuchet MS', Verdana, sans-serif" font-weight="700" font-size="150" fill="#1E1410"></text>
      <g id="wall"><g id="bricks"></g><g id="cracks"></g></g>
      <g id="debris"></g>
      <g id="army"></g>
      <g id="fx"></g>
      <rect y="262" width="1200" height="5" fill="#1E1410"/>
      <rect y="267" width="1200" height="3" fill="#C35E2B"/>
      <rect y="270" width="1200" height="2" fill="#1E1410"/>
      <rect y="272" width="1200" height="22" fill="url(#meander)" transform="translate(0,566) scale(1,-1)"/>
      <rect y="294" width="1200" height="2" fill="#1E1410"/>
    </svg>
  </div>

  <div class="controls">
    <div class="tries" id="tries" aria-hidden="true"></div>
    <span class="status" id="status" aria-live="polite">Listo para leer</span>
    <button id="hit">Leí la palabra</button>
    <button id="demo" class="secondary">Ver demo</button>
    <button id="reset" class="secondary">Reiniciar</button>
  </div>
  <p class="note">Prototipo: el botón «Leí la palabra» simula el reconocimiento de una lectura correcta. La palabra y el número de intentos se cambian en CONFIG, al inicio del script.</p>
</main>

<script>
/* ================== CONFIGURACIÓN ================== */
const CONFIG = {
  word: 'pelota',   // palabra a practicar
  hitsToBreak: 3    // lecturas correctas necesarias para derribar el muro
};

/* ================== UTILIDADES ================== */
const NS = 'http://www.w3.org/2000/svg';
const GROUND = 262;
const WALL = { x: 505, y: 80, w: 110, h: 182 };
const WALL_RIGHT = WALL.x + WALL.w;
const START_X = 1270;
const LEFT_LIMIT = 498;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const B = '#1E1410', C = '#F3DDB3', RED = '#A8321F', BK = '#3A2A1F';

const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f1 = v => v.toFixed(1);
const ease = {
  charge: t => 0.25 * t + 0.75 * t * t,
  outQuad: t => 1 - (1 - t) * (1 - t),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  walk: t => 0.2 * t * t + 0.8 * t
};
function tween(ms, fn, ez = t => t) {
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => {
      const t = Math.min(1, (now - t0) / ms);
      fn(ez(t), t);
      t < 1 ? requestAnimationFrame(step) : res();
    };
    requestAnimationFrame(step);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ================== PALABRA ================== */
const wordEl = $('word');
function fitWord() {
  wordEl.textContent = CONFIG.word;
  wordEl.setAttribute('font-size', 150);
  const w = wordEl.getBBox().width;
  if (w > 450) wordEl.setAttribute('font-size', f1(150 * 450 / w));
}

/* ================== MURO ================== */
const bricksG = $('bricks'), cracksG = $('cracks'), wallG = $('wall'), debrisG = $('debris'), fxG = $('fx');
const STONES = ['#E9C893', '#E2BC82', '#EDD3A2', '#DDB577'];
const CRACKS = [
  'M615,152 L601,158 L594,149 L580,166 L570,160 L556,177',
  'M601,158 L605,138 L594,125 L599,106',
  'M615,206 L601,201 L590,215 L575,209 L562,226',
  'M580,166 L566,149 L552,154 L540,139',
  'M590,215 L584,236 L572,244 L566,262'
];
let bricks = [], crackEls = [], debris = [], dust = [], shake = 0;

function buildWall() {
  bricksG.innerHTML = ''; cracksG.innerHTML = ''; debrisG.innerHTML = '';
  bricks = []; debris = [];
  const rows = 9, bh = WALL.h / rows, bw = 36;
  let i = 0;
  for (let r = 0; r < rows; r++) {
    const y0 = WALL.y + r * bh, off = r % 2 ? bw / 2 : 0;
    for (let x = WALL.x - off; x < WALL_RIGHT; x += bw) {
      const x0 = Math.max(x, WALL.x), x1 = Math.min(x + bw, WALL_RIGHT);
      if (x1 - x0 < 4) continue;
      const w = x1 - x0;
      const g = el('g', { transform: `translate(${x0 + w / 2},${y0 + bh / 2})` }, bricksG);
      el('rect', { x: -w / 2, y: -bh / 2, width: w, height: bh, fill: STONES[(i * 7 + r) % 4], stroke: B, 'stroke-width': 2 }, g);
      bricks.push({ g, cx: x0 + w / 2, cy: y0 + bh / 2, w, h: bh });
      i++;
    }
  }
  crackEls = CRACKS.map(d => {
    const p = el('path', { d, class: 'crack' }, cracksG);
    const len = p.getTotalLength();
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    return p;
  });
  cracksG.style.opacity = 1;
}
function loosen(b, vx, vy, vr, delay = 0) {
  bricks = bricks.filter(o => o !== b);
  debrisG.appendChild(b.g);
  debris.push({ ...b, x: b.cx, y: b.cy, vx, vy, vr, rot: 0, delay, resting: false });
}
function wallHit(final) {
  shake = reduceMotion ? 0 : (final ? 10 : 7);
  for (let i = 0; i < (final ? 30 : 18); i++) {
    spawnDust(WALL_RIGHT + rand(-2, 10), GROUND - Math.pow(Math.random(), 0.7) * WALL.h * 0.95,
              rand(20, final ? 220 : 140), rand(-90, 10), rand(3, final ? 11 : 7), rand(0.6, 1.1));
  }
  if (final) {
    cracksG.style.opacity = 0;
    [...bricks].forEach(b => {
      const top = 1 - (b.cy - WALL.y) / WALL.h;
      loosen(b, -rand(40, 200) * (0.4 + top), -rand(0, 160) * top, rand(-320, 320),
             ((WALL_RIGHT - b.cx) / WALL.w) * 0.12 + rand(0, 0.06));
    });
    return;
  }
  const n = CONFIG.hitsToBreak;
  const count = hits === 1 ? 1 : Math.round(1 + (CRACKS.length - 1) * (hits - 1) / Math.max(1, n - 2));
  crackEls.forEach((p, i) => { if (i < count) p.style.strokeDashoffset = 0; });
  if (hits >= 2) {
    bricks.filter(b => b.cx + b.w / 2 > WALL_RIGHT - 1 && b.cy > 120 && b.cy < 230)
      .sort(() => Math.random() - 0.5).slice(0, hits - 1)
      .forEach(b => loosen(b, rand(40, 90), rand(-60, 0), rand(-120, 120)));
  }
}

/* ================== PARTÍCULAS ================== */
function spawnDust(x, y, vx, vy, r, max) {
  const c = el('circle', { fill: C }, fxG);
  dust.push({ c, x, y, vx, vy, r, life: 0, max });
}
const STAR = 'M0,-5 L1.5,-1.5 L5,-1.5 L2.2,0.8 L3.2,4.5 L0,2.3 L-3.2,4.5 L-2.2,0.8 L-5,-1.5 L-1.5,-1.5Z';

/* ================== PERSONAJES ================== */
/* Cinco hoplitas con proporciones y carácter propios, mismo estilo de figuras negras. */
const CHARS = [
  { name: 'Leandro, el capitán', T: 34, S: 34, H: 44, W: 24, hs: 1.00, R: 28, crest: 'big',   crestCol: RED, emblem: 0, spear: 1.0,  stride: 150, hunch: 0,  bounce: 1.0 },
  { name: 'Teo, el larguirucho', T: 44, S: 44, H: 48, W: 19, hs: 0.92, R: 25, crest: 'long',  crestCol: B,   emblem: 3, spear: 1.15, stride: 195, hunch: -3, bounce: 0.8 },
  { name: 'Pipo, el pequeño',    T: 21, S: 21, H: 32, W: 20, hs: 1.06, R: 21, crest: 'tall',  crestCol: RED, emblem: 2, spear: 0.8,  stride: 80,  hunch: 0,  bounce: 1.4 },
  { name: 'Néstor, el veterano', T: 30, S: 31, H: 41, W: 24, hs: 1.00, R: 27, crest: 'droop', crestCol: B,   emblem: 4, spear: 1.0,  stride: 120, hunch: -9, bounce: 0.9, beard: 1, limp: 1 },
  { name: 'Dimas, el grandote',  T: 25, S: 25, H: 44, W: 30, hs: 1.08, R: 31, crest: 'short', crestCol: RED, emblem: 1, spear: 0.95, stride: 105, hunch: 0,  bounce: 1.5, belly: 1, waddle: 1 }
];
CHARS.forEach(c => { c.hipY = (c.T + c.S) * 0.97; c.scx = -c.W * 0.45 - c.R * 0.3; c.scy = -c.H * 0.55; });

const EMBLEMS = [
  `<circle r="5" fill="${C}"/><g stroke="${C}" stroke-width="1.6">` + [0,45,90,135,180,225,270,315].map(a => `<line y1="-8" y2="-12" transform="rotate(${a})"/>`).join('') + '</g>',
  `<path d="M3,-9 A9.5,9.5 0 1,0 3,9 A7,7 0 1,1 3,-9 Z" fill="${C}"/>`,
  `<circle cy="-6" r="3" fill="${C}"/><circle cx="-5.5" cy="4" r="3" fill="${C}"/><circle cx="5.5" cy="4" r="3" fill="${C}"/>`,
  `<path d="M-10,4 L-5,-5 L0,4 L5,-5 L10,4" fill="none" stroke="${C}" stroke-width="2.4" stroke-linejoin="round"/>`,
  `<circle r="7" fill="none" stroke="${C}" stroke-width="2"/><circle r="2.8" fill="${C}"/>`
];
const CRESTS = {
  big:   'M-12,-28 Q4,-53 30,-32 Q34,-22 27,-9 Q22,-28 6,-33 Q-4,-34 -12,-28 Z',
  long:  'M-10,-28 Q6,-50 42,-30 Q48,-20 41,-5 Q30,-26 8,-33 Q-2,-34 -10,-28 Z',
  tall:  'M-8,-29 Q0,-62 22,-41 Q27,-31 22,-18 Q16,-34 6,-34 Q-2,-34 -8,-29 Z',
  droop: 'M-10,-28 Q8,-44 26,-26 Q30,-14 24,1 Q18,-22 6,-32 Q-2,-34 -10,-28 Z',
  short: 'M-8,-27 Q4,-42 20,-30 Q22,-22 18,-16 Q14,-28 4,-31 Q-2,-31 -8,-27 Z'
};

function legSVG(T, S, wf, fill) {
  const a = 6.5 * wf, b = 5 * wf, c = 4.6 * wf;
  return `<path d="M${-a},-3 L${a},-3 L${b},${T} L${-b},${T} Z" fill="${fill}" stroke="${C}" stroke-width=".7"/>
    <g class="shin"><circle r="${b + 0.4}" fill="${fill}"/>
      <path d="M${-b},0 L${b},0 L${c},${S - 7} L${-c},${S - 7} Z" fill="${fill}" stroke="${C}" stroke-width=".7"/>
      <path d="M${-c},${S - 8} L${c},${S - 8} L${c},${S} L-17,${S} L-15,${S - 4} Z" fill="${fill}"/>
      <path d="M${-c + 1},${S * 0.35} Q0,${S * 0.42} ${c - 1},${S * 0.35}" stroke="${C}" stroke-width="1.1" fill="none"/>
    </g>`;
}

function buildWarrior(c, idx, parent) {
  const wf = c.belly ? 1.35 : (c.W < 20 ? 0.85 : 1);
  const hw = c.W / 2, H = c.H, L = 150 * c.spear;
  const pleats = [-0.7, -0.25, 0.2, 0.65].map(k => `M${f1(k * hw * 2)},-2 L${f1(k * hw * 2.2)},12`).join(' ');
  const strand = c.crestCol === B ? C : B;
  const root = el('g', {}, parent);
  root.innerHTML = `
  <g class="body">
    <g class="legB">${legSVG(c.T, c.S, wf, BK)}</g>
    <g class="torso">
      <g class="arm">
        <polyline points="0,0 7,14 -1,25" fill="none" stroke="${B}" stroke-width="${6 * wf}" stroke-linecap="round" stroke-linejoin="round"/>
        <g class="spear">
          <line y1="${f1(0.35 * L)}" y2="${f1(-0.65 * L)}" stroke="${B}" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M-4.5,${f1(-0.65 * L + 2)} L0,${f1(-0.65 * L - 18)} L4.5,${f1(-0.65 * L + 2)} Z" fill="${B}"/>
        </g>
        <circle cx="-1" cy="25" r="${4.2 * wf}" fill="${B}"/>
      </g>
      <path d="M${-hw * 0.85},2 L${hw * 0.85},2 L${hw * 1.05},${-H} Q0,${-H - 6} ${-hw * 0.95},${-H} Z" fill="${B}"/>
      ${c.belly ? `<g class="belly"><ellipse cx="${-hw * 0.5}" cy="${-H * 0.36}" rx="${hw * 0.95}" ry="${H * 0.33}" fill="${B}"/>
        <path d="M${-hw * 1.2},${-H * 0.5} Q${-hw * 1.5},${-H * 0.3} ${-hw * 1.1},${-H * 0.1}" fill="none" stroke="${C}" stroke-width="1.1"/></g>` : ''}
      <path d="M${-hw * 0.6},${-H * 0.82} Q${hw * 0.1},${-H * 0.62} ${hw * 0.8},${-H * 0.8}" fill="none" stroke="${C}" stroke-width="1.2"/>
      <rect x="-3" y="${-H - 5}" width="9" height="9" fill="${B}"/>
      <g class="head">
        ${c.beard ? `<path d="M-15,0 Q-20,14 -9,20 Q-1,20 3,6 L-6,3 Z" fill="${B}"/>
          <path d="M-13,6 Q-15,11 -11,16 M-8,7 Q-10,12 -6,17" fill="none" stroke="${C}" stroke-width="1"/>` : ''}
        <path d="M-15,4 L-17,-10 Q-16,-26 0,-27 Q15,-26 15,-10 L14,2 Q10,10 4,6 L2,-4 L-6,-4 L-7,6 Z" fill="${B}" stroke="${C}" stroke-width=".6"/>
        <path d="M-15,-12 Q-10,-15 -4,-12" fill="none" stroke="${C}" stroke-width="2.2"/>
        <circle cx="-10.5" cy="-12.6" r="1.5" fill="${B}"/>
        <rect x="0" y="-32" width="4" height="6" fill="${B}"/>
        <g class="crest">
          <path d="${CRESTS[c.crest]}" fill="${c.crestCol}" stroke="${B}" stroke-width="1.2"/>
          <path d="M-4,-35 Q9,-43 23,-30 M0,-38 Q12,-44 27,-25" fill="none" stroke="${strand}" stroke-width=".8" opacity=".6"/>
        </g>
      </g>
    </g>
    <g class="legF">${legSVG(c.T, c.S, wf, B)}</g>
    <g class="skirt">
      <path d="M${-hw * 1.15},14 L${hw * 1.15},14 L${hw * 0.95},-6 L${-hw * 0.95},-6 Z" fill="${B}" stroke="${C}" stroke-width=".7"/>
      <path d="M${-hw * 0.95},-4 L${hw * 0.95},-4 ${pleats}" stroke="${C}" stroke-width="1.1"/>
    </g>
    <g class="shield"><g transform="translate(${f1(c.scx)},${f1(c.scy)})">
      <circle r="${c.R}" fill="${B}" stroke="${C}" stroke-width="2"/>
      <circle r="${f1(c.R * 0.78)}" fill="none" stroke="${C}" stroke-width="1"/>
      <g transform="scale(${f1(c.R / 27)})">${EMBLEMS[c.emblem]}</g>
    </g></g>
  </g>`;
  const q = s => root.querySelector(s);
  return {
    c, idx, root, body: q('.body'), legB: q('.legB'), legF: q('.legF'),
    shinB: q('.legB .shin'), shinF: q('.legF .shin'), torso: q('.torso'), arm: q('.arm'),
    spearG: q('.spear'), head: q('.head'), crestG: q('.crest'), skirt: q('.skirt'),
    shield: q('.shield'), bellyG: q('.belly'),
    // estado animable
    x: START_X + 300, prevX: START_X + 300, facing: 1, look: 1, ph: rand(0, 6), amp: 0, gait: null,
    lean: 0, headTilt: 0, wob: 0, armAng: 0, spearAng: 0, shieldDrop: 0, shieldRot: 0, jump: 0,
    // muelles (movimiento secundario)
    sq: 0, sqV: 0, push: 0, pushV: 0, crest: 0, crestV: 0, belly: 0, bellyV: 0,
    by: 0, byV: 0, t: rand(0, 10), lastStep: 0
  };
}

/* Andares: correr, caminar derrotado, marchar orgulloso */
const RUN   = { thigh: 42, knee0: 12, knee: 72, bob: 6,   arm: 20, waddle: 4, sm: 1,    dust: true };
const SAD   = { thigh: 15, knee0: 6,  knee: 22, bob: 1.8, arm: 5,  waddle: 6, sm: 0.42 };
const MARCH = { thigh: 30, knee0: 8,  knee: 42, bob: 5,   arm: 12, waddle: 4, sm: 0.62 };

const armyG = $('army');
const warriors = [];
for (let i = CHARS.length - 1; i >= 0; i--) warriors[i] = buildWarrior(CHARS[i], i, armyG);
warriors.forEach(w => { w.gait = SAD; });

/* Formación: cada uno queda pegado a la espalda del de delante */
const TARGETS = [];
CHARS.forEach((c, i) => {
  const front = c.scx - c.R;
  if (i === 0) TARGETS[0] = WALL_RIGHT - front - 1;
  else { const p = CHARS[i - 1]; TARGETS[i] = TARGETS[i - 1] + p.W * 0.6 + 6 - front - 6; }
});

function updateWarrior(w, dt) {
  const c = w.c, g = w.gait;
  w.t += dt;
  const dx = w.x - w.prevX; w.prevX = w.x;
  const vx = dx / dt;
  w.ph += Math.abs(dx) / (c.stride * g.sm) * Math.PI * 2;

  // muelles: squash & stretch, empujones, cresta y barriga con inercia
  w.sqV += (-320 * w.sq - 15 * w.sqV) * dt; w.sq += w.sqV * dt;
  w.pushV += (-220 * w.push - 14 * w.pushV) * dt; w.push += w.pushV * dt;

  const a = w.amp, ph = w.ph, s = Math.sin(ph), co = Math.cos(ph);
  const limp = c.limp && g !== RUN;
  let bob = -a * g.bob * c.bounce * Math.abs(co);
  if (limp) bob += a * 3.5 * Math.max(0, -s);
  const breath = Math.sin(w.t * 2.4 + w.idx * 1.7) * 1.3 * (1 - a);
  const by = bob - w.jump;
  const byV = (by - w.by) / dt, byA = (byV - w.byV) / dt;
  w.by = by; w.byV = byV;

  const fwd = -vx * Math.sign(w.facing || 1);
  const crestT = clamp(fwd * 0.03, -8, 26) + clamp(-byV * 0.04, -12, 12);
  w.crestV += (120 * (crestT - w.crest) - 9 * w.crestV) * dt; w.crest += w.crestV * dt;
  w.bellyV += (-260 * w.belly - 10 * w.bellyV + clamp(-byA * 0.012, -400, 400)) * dt;
  w.belly = clamp(w.belly + w.bellyV * dt, -5, 5);

  // polvo de las pisadas al correr
  if (g.dust && a > 0.6) {
    const step = Math.floor(ph / Math.PI);
    if (step !== w.lastStep) {
      w.lastStep = step;
      spawnDust(w.x + w.push + 6, GROUND - 2, rand(30, 80), rand(-30, -10), rand(2, 4), rand(0.3, 0.5));
    }
  }

  // pose
  const kneeF = -a * (g.knee0 + g.knee * Math.pow(Math.max(0, co), 1.4));
  const kneeB = -a * (g.knee0 + g.knee * Math.pow(Math.max(0, -co), 1.4));
  const thF = a * g.thigh * s, thB = -a * g.thigh * s * (limp ? 0.55 : 1);
  const sway = (c.waddle || 0) * a * g.waddle * s;
  const lean = c.hunch + w.lean + sway + breath * 0.6;
  const fx = w.facing * (1 - 0.2 * w.sq), sy = 1 + 0.12 * w.sq;

  w.root.setAttribute('transform', `translate(${f1(w.x + w.push)},${f1(GROUND - w.jump)}) scale(${fx.toFixed(3)},${sy.toFixed(3)})`);
  w.body.setAttribute('transform', `translate(0,${f1(-c.hipY + bob + breath * 0.4)})`);
  w.legF.setAttribute('transform', `rotate(${f1(thF)})`);
  w.legB.setAttribute('transform', `rotate(${f1(thB)})`);
  w.shinF.setAttribute('transform', `translate(0,${c.T}) rotate(${f1(kneeF)})`);
  w.shinB.setAttribute('transform', `translate(0,${c.T}) rotate(${f1(kneeB)})`);
  w.torso.setAttribute('transform', `rotate(${f1(lean)})`);
  w.skirt.setAttribute('transform', `rotate(${f1(lean * 0.5)})`);
  w.arm.setAttribute('transform', `translate(${f1(c.W * 0.15)},${-c.H + 7}) rotate(${f1(w.armAng + a * g.arm * s)})`);
  w.spearG.setAttribute('transform', `translate(-1,25) rotate(${f1(w.spearAng + a * g.arm * 0.3 * s)})`);
  w.head.setAttribute('transform', `translate(2,${-c.H - 1}) rotate(${f1(w.headTilt + w.wob + a * 2 * Math.sin(2 * ph))}) scale(${(w.look * c.hs).toFixed(3)},${c.hs})`);
  w.crestG.setAttribute('transform', `rotate(${f1(w.crest)} 2 -27)`);
  if (w.bellyG) w.bellyG.setAttribute('transform', `translate(0,${f1(w.belly)})`);
  const drop = w.shieldDrop + w.belly * 0.6 + a * 1.5 * Math.cos(2 * ph);
  w.shield.setAttribute('transform', `rotate(${f1(lean)}) translate(0,${f1(drop)}) rotate(${f1(w.shieldRot - a * g.arm * 0.25 * s)} ${f1(c.scx)} ${f1(c.scy)})`);
}

/* ================== HERRAMIENTAS DE ANIMACIÓN ================== */
function tw(w, props, ms, ez = ease.inOutSine) {
  const from = {};
  for (const k in props) from[k] = w[k];
  return tween(ms, e => { for (const k in props) w[k] = lerp(from[k], props[k], e); }, ez);
}
function moveTo(w, x, ms, ez = t => t) {
  const from = w.x;
  return tween(ms, e => { w.x = lerp(from, x, e); }, ez);
}
async function hop(w, h, ms) {
  w.sqV -= 7;                                   // se estira al despegar
  await tween(ms, (e, t) => { w.jump = h * Math.sin(Math.PI * t); });
  w.jump = 0; w.sq = Math.max(w.sq, 0.6); w.bellyV += 70; w.crestV += 120;   // aplasta al aterrizar
}
async function turn(w, to) {
  const from = w.facing;
  w.sqV -= 3;
  await tween(240, (e, t) => { w.facing = lerp(from, to, ease.inOutSine(t)); w.jump = 6 * Math.sin(Math.PI * t); });
  w.jump = 0; w.facing = to;
}
function stars(w, ms) {
  const g = el('g', {}, fxG);
  const st = [0, 1, 2].map(() => el('path', { d: STAR, fill: C, stroke: B, 'stroke-width': 0.8 }, g));
  const c = w.c;
  return tween(ms, (e, t) => {
    const topY = GROUND - c.hipY - c.H - 36 * c.hs - w.jump;
    st.forEach((s, k) => {
      const ang = t * Math.PI * 5 + k * 2.09;
      s.setAttribute('transform', `translate(${f1(w.x + w.push + Math.cos(ang) * 18)},${f1(topY + Math.sin(ang) * 5)}) scale(${(0.9 + 0.25 * Math.sin(ang)).toFixed(2)})`);
    });
    g.setAttribute('opacity', t > 0.75 ? ((1 - t) / 0.25).toFixed(2) : 1);
  }).then(() => g.remove());
}

/* ================== GUION ================== */
// [retraso de salida, duración de la carrera]: cada uno llega a su ritmo
const RUN_T = [[0, 1150], [150, 1120], [40, 1380], [260, 1420], [330, 1520]];

async function charge(w, i, final) {
  const [delay, dur] = RUN_T[i];
  Object.assign(w, { x: START_X + i * 55 + rand(0, 30), facing: 1, look: 1, gait: RUN, amp: 1, lean: -12,
                     headTilt: -5, wob: 0, armAng: -8, spearAng: -16, shieldDrop: 0, shieldRot: -4, jump: 0 });
  w.prevX = w.x;
  await wait(delay);
  const tx = TARGETS[i];
  // anticipación: en el último tramo se lanzan hacia delante
  wait(dur * 0.75).then(() => { w.sqV -= 5; tw(w, { lean: -24, headTilt: -12, shieldRot: -12 }, dur * 0.25, ease.outQuad); });
  await moveTo(w, tx, dur, ease.charge);
  impact(w, i, final);
  tw(w, { amp: 0 }, 220, ease.outQuad);
  if (final && i === 0) {
    tw(w, { lean: -30 }, 180);
    await moveTo(w, tx - 34, 340, ease.outQuad);          // tropieza hacia el hueco
    await tw(w, { lean: -4, headTilt: 0, shieldRot: 0 }, 350, ease.outQuad);
  } else {
    tw(w, { lean: 10, headTilt: 8, shieldRot: 10 }, 160, ease.outQuad)
      .then(() => tw(w, { lean: 0, headTilt: 0, shieldRot: 0 }, 420));
    await moveTo(w, tx + 12 + rand(0, 10), 220, ease.outQuad);   // rebote
  }
}

function impact(w, i, final) {
  w.sq = 1; w.sqV = 0; w.bellyV += 90; w.crestV += 260;
  if (i === 0) wallHit(final);
  else {
    const f = warriors[i - 1];                // choca con la espalda del compañero
    f.pushV -= 160; f.sq = Math.max(f.sq, 0.45); f.crestV += 150;
    if (!final && !reduceMotion) shake = Math.max(shake, 2.5);
  }
}

// Derrotados: cada uno reacciona y se retira a su manera
const RETREAT = [
  { delay: 750, dur: 2400, head: -16, looks: [0.45] },        // capitán: aturdido, mira atrás una vez
  { delay: 420, dur: 2500, head: -12, looks: [0.25, 0.65] },  // larguirucho: no deja de mirar el muro
  { delay: 260, dur: 1900, head: -26, looks: [] },            // pequeño: cabizbajo, pasitos rápidos
  { delay: 140, dur: 3000, head: -14, looks: [], pause: 0.5 },// veterano: cojea y se para a resoplar
  { delay: 0,   dur: 2600, head: -15, looks: [0.55] }         // grandote: bamboleo y mirada de reojo
];
async function retreat(w, i) {
  const r = RETREAT[i];
  const react = [
    () => tween(900, (e, t) => { w.wob = Math.sin(t * Math.PI * 6) * 12 * (1 - t); }),
    () => tw(w, { headTilt: 16 }, 300).then(() => tw(w, { headTilt: -6 }, 450)),
    async () => { await hop(w, 8, 200); await hop(w, 5, 170); },
    () => tw(w, { lean: -16, headTilt: -10 }, 500),
    () => tw(w, { lean: 6, headTilt: 8 }, 300).then(() => tw(w, { lean: 0, headTilt: -4 }, 350))
  ];
  react[i]();
  await wait(r.delay);
  await turn(w, -1);
  w.gait = SAD; w.amp = 0;
  tw(w, { amp: 1, lean: -10, headTilt: r.head, wob: 0, armAng: -10, spearAng: 42, shieldDrop: 14, shieldRot: 20 }, 450);
  r.looks.forEach(p => wait(r.dur * p).then(async () => {
    await tw(w, { look: -1, headTilt: -2 }, 260);
    await wait(i === 0 ? 650 : 500);
    await tw(w, { look: 1, headTilt: r.head }, 300);
  }));
  const end = START_X + 80;
  if (r.pause) {
    const mid = w.x + (end - w.x) * r.pause;
    await moveTo(w, mid, r.dur * r.pause, ease.walk);
    await tw(w, { amp: 0, lean: -22, headTilt: -20 }, 300);       // resopla
    await wait(380);
    w.sqV -= 3;
    await tw(w, { amp: 1, lean: -12, headTilt: r.head }, 300);
    await moveTo(w, end, r.dur * (1 - r.pause));
  } else await moveTo(w, end, r.dur, ease.walk);
  w.amp = 0;
}

// Victoria: cada uno celebra con su personalidad
async function celebrate(w, i) {
  w.amp = 0;
  if (i === 0) {
    await tw(w, { armAng: -155, spearAng: 150, headTilt: 10, lean: 4 }, 280, ease.outQuad);
    for (let k = 0; k < 3; k++)
      await Promise.all([hop(w, 14, 260), tw(w, { armAng: -172 }, 130).then(() => tw(w, { armAng: -150 }, 130))]);
  } else if (i === 1) {
    await tw(w, { lean: -6 }, 160); w.sq = 0.5; await wait(120);
    await Promise.all([hop(w, 36, 560), tw(w, { armAng: -160, spearAng: 160, headTilt: 12 }, 300)]);
    await tween(500, (e, t) => { w.armAng = -160 + Math.sin(t * Math.PI * 4) * 14; });
  } else if (i === 2) {
    tw(w, { armAng: -150, spearAng: 145, headTilt: 12 }, 200);
    for (let k = 0; k < 4; k++) await hop(w, 22, 230);
  } else if (i === 3) {
    await wait(250);
    await tw(w, { armAng: -120, spearAng: 120, headTilt: 14, lean: -2 }, 600);
    await hop(w, 6, 220);
    await tw(w, { lean: -14, headTilt: 2 }, 500);            // ¡ay, la espalda!
  } else {
    await wait(120);
    await hop(w, 12, 330); await hop(w, 14, 340);
    await tw(w, { armAng: -130, spearAng: 130, headTilt: 10 }, 300);
  }
}
const MARCH_T = [
  { delay: 500, dur: 2200, looks: [0.4] }, { delay: 300, dur: 2000, looks: [0.6] },
  { delay: 150, dur: 1700, looks: [] },    { delay: 200, dur: 2600, looks: [0.3] },
  { delay: 0,   dur: 2300, looks: [] }
];
async function marchOff(w, i) {
  const m = MARCH_T[i];
  await wait(m.delay);
  await turn(w, -1);
  w.gait = MARCH; w.amp = 0;
  tw(w, { amp: 1, lean: i === 3 ? -4 : 5, headTilt: 8, armAng: -6, spearAng: 2, shieldDrop: 0, shieldRot: 0 }, 400);
  m.looks.forEach(p => wait(m.dur * p).then(async () => {
    await tw(w, { look: -1 }, 240); await wait(500); await tw(w, { look: 1 }, 260);
  }));
  await moveTo(w, START_X + 80, m.dur);
  w.amp = 0;
}

/* ================== BUCLE ================== */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, Math.max(0.001, (now - last) / 1000)); last = now;
  for (const d of debris) {
    if (d.delay > 0) { d.delay -= dt; continue; }
    if (!d.resting) {
      d.vy += 1500 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
      if (d.x < LEFT_LIMIT + d.w / 2) { d.x = LEFT_LIMIT + d.w / 2; d.vx = -d.vx * 0.3; }
      const floor = GROUND - d.h / 2;
      if (d.y > floor) {
        d.y = floor; d.vy = -d.vy * 0.25; d.vx *= 0.5; d.vr *= 0.4;
        if (Math.abs(d.vy) < 40) { d.vy = 0; d.resting = true; }
      }
    } else { d.vx *= 0.85; d.x += d.vx * dt; }
    d.g.setAttribute('transform', `translate(${f1(d.x)},${f1(d.y)}) rotate(${f1(d.rot)})`);
  }
  dust = dust.filter(p => {
    p.life += dt;
    if (p.life > p.max) { p.c.remove(); return false; }
    p.vx *= 0.94; p.vy *= 0.94; p.vy -= 20 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const k = p.life / p.max;
    p.c.setAttribute('cx', f1(p.x)); p.c.setAttribute('cy', f1(p.y));
    p.c.setAttribute('r', f1(p.r * (1 + k))); p.c.setAttribute('opacity', (0.75 * (1 - k)).toFixed(2));
    return true;
  });
  shake = Math.max(0, shake - dt * 28);
  wallG.setAttribute('transform', `translate(${shake ? f1(rand(-shake, shake)) : 0},0)`);
  warriors.forEach(w => updateWarrior(w, dt));
  requestAnimationFrame(loop);
}

/* ================== SECUENCIA E INTERFAZ ================== */
let hits = 0, busy = false;

async function attack() {
  hits++;
  const final = hits >= CONFIG.hitsToBreak;
  updateUI();
  await Promise.all(warriors.map((w, i) => charge(w, i, final)));
  if (final) {
    await wait(150);
    await Promise.all(warriors.map((w, i) => celebrate(w, i)));
    await Promise.all(warriors.map((w, i) => marchOff(w, i)));
  } else {
    await wait(200);
    stars(warriors[0], 1500);
    await Promise.all(warriors.map((w, i) => retreat(w, i)));
  }
}

const triesEl = $('tries'), statusEl = $('status');
const hitBtn = $('hit'), demoBtn = $('demo'), resetBtn = $('reset');
for (let i = 0; i < CONFIG.hitsToBreak; i++) triesEl.appendChild(document.createElement('span'));

function updateUI() {
  [...triesEl.children].forEach((s, i) => s.classList.toggle('on', i < hits));
  const done = hits >= CONFIG.hitsToBreak;
  statusEl.textContent = done ? '¡Muro derribado!' : hits === 0 ? 'Listo para leer' : `Lectura ${hits} de ${CONFIG.hitsToBreak}`;
  hitBtn.disabled = busy || done; demoBtn.disabled = busy || done; resetBtn.disabled = busy;
}
async function run(fn) {
  if (busy) return;
  busy = true; updateUI();
  try { await fn(); } finally { busy = false; updateUI(); }
}
hitBtn.addEventListener('click', () => run(attack));
demoBtn.addEventListener('click', () => run(async () => {
  while (hits < CONFIG.hitsToBreak) { await attack(); await wait(400); }
}));
resetBtn.addEventListener('click', () => {
  if (busy) return;
  hits = 0;
  dust.forEach(p => p.c.remove()); dust = [];
  warriors.forEach(w => Object.assign(w, { x: START_X + 300, prevX: START_X + 300, amp: 0, facing: 1, look: 1 }));
  buildWall(); updateUI();
});

buildWall();
updateUI();
requestAnimationFrame(loop);
(document.fonts ? document.fonts.ready : Promise.resolve()).then(fitWord);
fitWord();
</script>
