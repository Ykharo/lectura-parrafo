<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Lectura de párrafos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=6">
  <script>
    // Diagnóstico: si algo falla, el error se muestra en pantalla (útil en el iPad). Tocar para cerrar.
    (function () {
      function mostrar(texto) {
        var caja = document.getElementById('errores');
        if (!caja) {
          caja = document.createElement('div');
          caja.id = 'errores';
          caja.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99;padding:10px 12px;border:1px solid #e5484d;' +
            'border-radius:10px;background:#1a0505;color:#ffb4b4;font:13px/1.4 monospace;white-space:pre-wrap;max-height:40vh;overflow:auto';
          caja.onclick = function () { caja.remove(); };
          (document.body || document.documentElement).appendChild(caja);
        }
        caja.textContent += texto + '\n';
      }
      window.addEventListener('error', function (e) {
        var archivo = String(e.filename || '').split('/').pop();
        mostrar('Error: ' + e.message + (archivo ? ' (' + archivo + ':' + e.lineno + ')' : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        mostrar('Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
    })();
  </script>
</head>
<body>
  <nav class="pasos" aria-label="Etapas">
    <span data-paso="1" data-n="1">Mirar</span>
    <span data-paso="2" data-n="2">Practicar</span>
    <span data-paso="3" data-n="3">Frases</span>
    <span data-paso="4" data-n="4">Leer</span>
  </nav>

  <main id="vista"></main>
  <footer id="acciones"></footer>

  <div id="mic" class="mic" hidden title="Escuchando"></div>
  <div id="aviso" class="aviso" hidden></div>

  <!-- ?v= obliga al iPad a descargar la versión nueva (subir el número en cada cambio) -->
  <script src="js/analisis.js?v=6"></script>
  <script src="js/almacen.js?v=6"></script>
  <script src="js/textos.js?v=6"></script>
  <script src="js/cuento.js?v=6"></script>
  <script src="js/cuentos/astronauta.js?v=6"></script>
  <script src="js/juegos/escalera.js?v=6"></script>
  <script src="js/juegos/muro.js?v=6"></script>
  <script src="js/cuento-app.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
