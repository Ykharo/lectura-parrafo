<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Recortar piezas</title></head>
<body>
<!-- Separa las piezas de una lámina (ilustraciones sobre fondo claro) en PNG transparentes.
     Lo usa herramientas/recortar.js; también se puede abrir a mano: recortar.html?img=ruta.png -->
<pre id="salida">trabajando…</pre>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const src = q.get('img');
  const UMBRAL = Number(q.get('umbral') || 30);
  const MINIMO = Number(q.get('min') || 1500);
  const img = new Image();
  img.src = src;
  await img.decode();
  const w = img.naturalWidth, h = img.naturalHeight, n = w * h;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const px = ctx.getImageData(0, 0, w, h).data;

  // Color de fondo: mediana de una franja de 12 px en los cuatro bordes
  const muestras = [[], [], []];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (x >= 12 && x < w - 12 && y >= 12 && y < h - 12) continue;
    const i = (y * w + x) * 4;
    muestras[0].push(px[i]); muestras[1].push(px[i + 1]); muestras[2].push(px[i + 2]);
  }
  const mediana = (a) => { a.sort((p, q2) => p - q2); return a[a.length >> 1]; };
  const fondo = muestras.map(mediana);
  const brilloFondo = (fondo[0] + fondo[1] + fondo[2]) / 3;

  // Máscara: lejos del fondo, o filo blanco (más claro que el fondo y sin color)
  let m = new Uint8Array(n);
  for (let k = 0; k < n; k++) {
    const r = px[k * 4], g = px[k * 4 + 1], b = px[k * 4 + 2];
    const d = Math.hypot(r - fondo[0], g - fondo[1], b - fondo[2]);
    const brillo = (r + g + b) / 3, sat = Math.max(r, g, b) - Math.min(r, g, b);
    m[k] = d > UMBRAL || (brillo > brilloFondo + 9 && sat < 22) ? 1 : 0;
  }
  // Morfología 3×3: apertura (quita puntitos) y cierre (une bordes)
  const paso = (src2, dilatar) => {
    const out = new Uint8Array(n);
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const k = y * w + x;
      let v = dilatar ? 0 : 1;
      for (let dy = -1; dy <= 1 && v === (dilatar ? 0 : 1); dy++)
        for (let dx = -1; dx <= 1; dx++) {
          const s = src2[k + dy * w + dx];
          if (dilatar && s) { v = 1; break; }
          if (!dilatar && !s) { v = 0; break; }
        }
      out[k] = v;
    }
    return out;
  };
  m = paso(paso(m, false), true);           // apertura
  m = paso(paso(paso(paso(m, true), true), false), false); // cierre ×2

  // Rellenar agujeros: lo que no es pieza y no se alcanza desde el borde, es pieza
  const fuera = new Uint8Array(n);
  const cola = [];
  const empuja = (k) => { if (!m[k] && !fuera[k]) { fuera[k] = 1; cola.push(k); } };
  for (let x = 0; x < w; x++) { empuja(x); empuja((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { empuja(y * w); empuja(y * w + w - 1); }
  while (cola.length) {
    const k = cola.pop(), x = k % w, y = (k / w) | 0;
    if (x > 0) empuja(k - 1); if (x < w - 1) empuja(k + 1);
    if (y > 0) empuja(k - w); if (y < h - 1) empuja(k + w);
  }
  for (let k = 0; k < n; k++) if (!fuera[k]) m[k] = 1;

  // Regiones (4-vecindad)
  const etiqueta = new Int32Array(n);
  const piezas = [];
  let id = 0;
  for (let k0 = 0; k0 < n; k0++) {
    if (!m[k0] || etiqueta[k0]) continue;
    id++;
    let area = 0, x0 = w, x1 = 0, y0 = h, y1 = 0;
    const pila = [k0];
    etiqueta[k0] = id;
    while (pila.length) {
      const k = pila.pop(), x = k % w, y = (k / w) | 0;
      area++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      const vec = [x > 0 ? k - 1 : -1, x < w - 1 ? k + 1 : -1, y > 0 ? k - w : -1, y < h - 1 ? k + w : -1];
      for (const v of vec) if (v >= 0 && m[v] && !etiqueta[v]) { etiqueta[v] = id; pila.push(v); }
    }
    if (area >= MINIMO) piezas.push({ id, area, x0, x1, y0, y1 });
  }
  // Orden de lectura: filas (por el centro) y de izquierda a derecha
  const altoFila = h / 8;
  piezas.sort((a, b) => (Math.round((a.y0 + a.y1) / 2 / altoFila) - Math.round((b.y0 + b.y1) / 2 / altoFila)) || ((a.x0 + a.x1) - (b.x0 + b.x1)));

  const resultado = [];
  const margen = 3;
  piezas.forEach((p, num) => {
    const x0 = Math.max(0, p.x0 - margen), y0 = Math.max(0, p.y0 - margen);
    const x1 = Math.min(w - 1, p.x1 + margen), y1 = Math.min(h - 1, p.y1 + margen);
    const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
    const c2 = document.createElement('canvas');
    c2.width = cw; c2.height = ch;
    const x2 = c2.getContext('2d');
    const datos = x2.createImageData(cw, ch);
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      const k = (y0 + y) * w + (x0 + x), o = (y * cw + x) * 4;
      datos.data[o] = px[k * 4]; datos.data[o + 1] = px[k * 4 + 1]; datos.data[o + 2] = px[k * 4 + 2];
      // borde suave: 50 % de opacidad en los píxeles de pieza que tocan el fondo
      let a = etiqueta[k] === p.id ? 255 : 0;
      if (a && (etiqueta[k - 1] !== p.id || etiqueta[k + 1] !== p.id || etiqueta[k - w] !== p.id || etiqueta[k + w] !== p.id)) a = 140;
      datos.data[o + 3] = a;
    }
    x2.putImageData(datos, 0, 0);
    resultado.push({ nombre: `pieza-${String(num + 1).padStart(2, '0')}.png`, x: x0, y: y0, w: cw, h: ch, png: c2.toDataURL('image/png') });
    ctx.strokeStyle = '#d00'; ctx.lineWidth = 2; ctx.strokeRect(x0, y0, cw, ch);
    ctx.fillStyle = '#d00'; ctx.font = 'bold 22px sans-serif'; ctx.fillText(String(num + 1), x0 + 4, y0 + 22);
  });
  document.getElementById('salida').textContent = JSON.stringify({
    fondo, ancho: w, alto: h, piezas: resultado, indice: cv.toDataURL('image/jpeg', 0.85),
  });
})().catch((e) => { document.getElementById('salida').textContent = 'ERROR ' + e; });
</script>
</body></html>
